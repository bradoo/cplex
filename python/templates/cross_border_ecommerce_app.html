<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跨境电商库存与运输模拟器</title>
  <style>
    :root {
      --bg: #f5f7f8;
      --panel: #ffffff;
      --ink: #20252b;
      --muted: #65717d;
      --line: #dce2e8;
      --blue: #1f6feb;
      --green: #147d55;
      --amber: #9a6400;
      --red: #b8392f;
      --soft-blue: #e8f1ff;
      --soft-green: #e7f5ee;
      --soft-amber: #fff3d6;
      --soft-red: #fdecea;
      --soft-gray: #edf1f4;
      --shadow: 0 14px 34px rgba(28, 38, 50, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .header-inner,
    main {
      width: min(1240px, calc(100% - 32px));
      margin: 0 auto;
    }

    .header-inner {
      padding: 22px 0 18px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      padding: 22px 0 42px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      align-items: start;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-head {
      min-height: 58px;
      padding: 15px 17px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .tag {
      border-radius: 8px;
      padding: 5px 9px;
      color: var(--green);
      background: var(--soft-green);
      font-size: 12px;
      font-weight: 760;
      white-space: nowrap;
    }

    .controls,
    .content {
      padding: 16px 17px 18px;
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 720;
    }

    select,
    input {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 9px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-weight: 700;
    }

    .scenario-select-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .scenario-nav {
      display: grid;
      gap: 13px;
    }

    .nav-group {
      display: grid;
      gap: 7px;
    }

    .nav-group-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 820;
    }

    .nav-item {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
      color: var(--ink);
      text-align: left;
      font-size: 13px;
      font-weight: 780;
      line-height: 1.25;
      box-shadow: none;
    }

    .nav-item:hover {
      border-color: #b8c4d1;
      background: #f8fafc;
    }

    .nav-item.active {
      border-color: #b6caff;
      background: var(--soft-blue);
      color: var(--blue);
      box-shadow: inset 4px 0 0 var(--blue);
    }

    .parameter-divider {
      height: 1px;
      background: var(--line);
      margin: 2px 0;
    }

    .current-scenario {
      display: grid;
      gap: 4px;
      padding: 10px 11px;
      border: 1px solid #b6caff;
      border-radius: 8px;
      background: var(--soft-blue);
    }

    .current-scenario-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 780;
    }

    .current-scenario-name {
      color: var(--blue);
      font-size: 15px;
      font-weight: 850;
    }

    .scenario-summary {
      display: grid;
      gap: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .data-editor {
      display: grid;
      gap: 8px;
    }

    .data-editor.hidden {
      display: none;
    }

    .data-editor-title {
      color: var(--muted);
      font-size: 13px;
      font-weight: 820;
    }

    .data-editor-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 8px;
      align-items: end;
    }

    .data-editor-heading {
      color: var(--muted);
      font-size: 12px;
      font-weight: 780;
    }

    .data-editor-name {
      min-height: 38px;
      display: flex;
      align-items: center;
      color: var(--ink);
      font-size: 13px;
      font-weight: 780;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-weight: 820;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.72;
      cursor: progress;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .model-explain {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .charts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .chart-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
      min-width: 0;
    }

    .chart-title {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 820;
    }

    .bar-row {
      display: grid;
      grid-template-columns: minmax(96px, 160px) 1fr minmax(54px, auto);
      gap: 9px;
      align-items: center;
      margin: 8px 0;
      font-size: 12px;
    }

    .bar-label {
      color: var(--ink);
      font-weight: 720;
      overflow-wrap: anywhere;
    }

    .bar-track {
      height: 10px;
      border-radius: 999px;
      background: var(--soft-gray);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      min-width: 2px;
      border-radius: inherit;
      background: var(--blue);
    }

    .bar-fill.green { background: var(--green); }
    .bar-fill.amber { background: #d18b00; }
    .bar-fill.red { background: var(--red); }

    .bar-value {
      color: var(--muted);
      font-weight: 760;
      text-align: right;
      white-space: nowrap;
    }

    .stack-row {
      display: grid;
      gap: 6px;
      margin: 10px 0;
    }

    .stack-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 780;
    }

    .stack-track {
      display: flex;
      height: 18px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--soft-gray);
    }

    .stack-segment {
      min-width: 2px;
      height: 100%;
    }

    .chart-empty {
      color: var(--muted);
      font-size: 13px;
    }

    .explain-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
      min-width: 0;
    }

    .explain-title {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 820;
    }

    .explain-card ul {
      margin: 0;
      padding-left: 18px;
    }

    .explain-card li {
      margin: 4px 0;
      font-size: 13px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
    }

    .metric-value {
      margin-top: 4px;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 850;
      overflow-wrap: anywhere;
    }

    .bands {
      display: grid;
      gap: 12px;
    }

    .band {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .band-title {
      padding: 10px 12px;
      background: var(--soft-gray);
      font-weight: 820;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      border-top: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      background: #fafbfc;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 8px;
      padding: 3px 8px;
      background: var(--soft-blue);
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      margin: 2px 4px 2px 0;
    }

    .alert {
      background: var(--soft-amber);
      color: var(--amber);
      border: 1px solid #f2d79b;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 720;
    }

    .bad {
      background: var(--soft-red);
      color: var(--red);
      border-color: #f3c6c1;
    }

    @media (max-width: 900px) {
      .header-inner,
      main {
        width: min(100% - 24px, 1240px);
        grid-template-columns: 1fr;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .model-explain {
        grid-template-columns: 1fr;
      }

      .charts {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>跨境电商库存与运输模拟器</h1>
        <p class="subtitle">仓网、库存、补货、服务等级、促销、退货和绿色物流的 CPLEX 求解演示</p>
      </div>
      <button id="solveBtn">重新求解</button>
    </div>
  </header>

  <main>
    <section>
      <div class="section-head">
        <h2>场景导航与参数</h2>
        <span class="tag">CPLEX</span>
      </div>
      <div class="controls">
        <div class="field scenario-select-hidden">
          <label for="scenario">演示场景</label>
          <select id="scenario" aria-label="演示场景">
            <optgroup label="仓网与履约">
              <option value="strict_sla">严格 SLA</option>
              <option value="soft_capacity">旺季缺口分析</option>
              <option value="capacity_expansion">旺季临时扩容</option>
              <option value="inventory_placement">库存前置分配</option>
              <option value="market_entry">新市场进入决策</option>
              <option value="weather_risk_network">天气风险建仓选址</option>
              <option value="profit_allocation">库存不足利润优先分配</option>
            </optgroup>
            <optgroup label="补货与库存">
              <option value="replenishment_scenarios">补货情景分析</option>
              <option value="supplier_sourcing">多供应商采购分配</option>
              <option value="inventory_transfer">跨仓库存调拨</option>
              <option value="safety_stock">安全库存优化</option>
              <option value="robust_inventory">稳健库存计划</option>
            </optgroup>
            <optgroup label="物流路径与服务">
              <option value="landed_cost">Landed Cost 路径选择</option>
              <option value="tariff_sensitivity">关税政策敏感性</option>
              <option value="percentile_sla">百分比 SLA 路径选择</option>
              <option value="sla_sensitivity">SLA 敏感性分析</option>
              <option value="green_logistics">绿色物流成本/碳排</option>
              <option value="multi_objective">多目标权衡</option>
              <option value="resilience">物流韧性预案</option>
              <option value="channel_allocation">渠道分配优化</option>
            </optgroup>
            <optgroup label="经营动作">
              <option value="returns">退货逆向物流</option>
              <option value="return_grading">退货分级再销售</option>
              <option value="promotion_planning">促销预算计划</option>
              <option value="promotion_sensitivity">促销预算敏感性</option>
              <option value="markdown_clearance">清仓折扣优化</option>
              <option value="penalty_sensitivity">未履约罚分敏感性</option>
              <option value="dashboard">经营看板汇总</option>
            </optgroup>
          </select>
        </div>
        <nav class="scenario-nav" id="scenarioNav" aria-label="演示场景导航">
          <div class="nav-group">
            <div class="nav-group-title">仓网与履约</div>
            <button type="button" class="nav-item" data-scenario="strict_sla">严格 SLA</button>
            <button type="button" class="nav-item" data-scenario="soft_capacity">旺季缺口分析</button>
            <button type="button" class="nav-item" data-scenario="capacity_expansion">旺季临时扩容</button>
            <button type="button" class="nav-item" data-scenario="inventory_placement">库存前置分配</button>
            <button type="button" class="nav-item" data-scenario="market_entry">新市场进入决策</button>
            <button type="button" class="nav-item" data-scenario="weather_risk_network">天气风险建仓选址</button>
            <button type="button" class="nav-item" data-scenario="profit_allocation">库存不足利润优先分配</button>
          </div>
          <div class="nav-group">
            <div class="nav-group-title">补货与库存</div>
            <button type="button" class="nav-item" data-scenario="replenishment_scenarios">补货情景分析</button>
            <button type="button" class="nav-item" data-scenario="supplier_sourcing">多供应商采购分配</button>
            <button type="button" class="nav-item" data-scenario="inventory_transfer">跨仓库存调拨</button>
            <button type="button" class="nav-item" data-scenario="safety_stock">安全库存优化</button>
            <button type="button" class="nav-item" data-scenario="robust_inventory">稳健库存计划</button>
          </div>
          <div class="nav-group">
            <div class="nav-group-title">物流路径与服务</div>
            <button type="button" class="nav-item" data-scenario="landed_cost">Landed Cost 路径选择</button>
            <button type="button" class="nav-item" data-scenario="tariff_sensitivity">关税政策敏感性</button>
            <button type="button" class="nav-item" data-scenario="percentile_sla">百分比 SLA 路径选择</button>
            <button type="button" class="nav-item" data-scenario="sla_sensitivity">SLA 敏感性分析</button>
            <button type="button" class="nav-item" data-scenario="green_logistics">绿色物流成本/碳排</button>
            <button type="button" class="nav-item" data-scenario="multi_objective">多目标权衡</button>
            <button type="button" class="nav-item" data-scenario="resilience">物流韧性预案</button>
            <button type="button" class="nav-item" data-scenario="channel_allocation">渠道分配优化</button>
          </div>
          <div class="nav-group">
            <div class="nav-group-title">经营动作</div>
            <button type="button" class="nav-item" data-scenario="returns">退货逆向物流</button>
            <button type="button" class="nav-item" data-scenario="return_grading">退货分级再销售</button>
            <button type="button" class="nav-item" data-scenario="promotion_planning">促销预算计划</button>
            <button type="button" class="nav-item" data-scenario="promotion_sensitivity">促销预算敏感性</button>
            <button type="button" class="nav-item" data-scenario="markdown_clearance">清仓折扣优化</button>
            <button type="button" class="nav-item" data-scenario="penalty_sensitivity">未履约罚分敏感性</button>
            <button type="button" class="nav-item" data-scenario="dashboard">经营看板汇总</button>
          </div>
        </nav>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2>求解结果</h2>
        <span class="tag" id="statusTag">ready</span>
      </div>
      <div class="content">
        <div class="scenario-summary">
          <div class="current-scenario">
            <div class="current-scenario-label">当前场景</div>
            <div class="current-scenario-name" id="currentScenarioName">严格 SLA</div>
          </div>
          <div class="grid">
            <div class="field">
              <label for="demand">需求倍率</label>
              <input id="demand" type="number" min="0.5" max="2" step="0.05" value="1">
            </div>
            <div class="field">
              <label for="sla">SLA 放宽天数</label>
              <input id="sla" type="number" min="0" max="10" step="1" value="0">
            </div>
          </div>
          <div class="grid">
            <div class="field">
              <label for="penalty">未履约罚分</label>
              <input id="penalty" type="number" min="1" max="120" step="1" value="50">
            </div>
            <div class="field">
              <label for="air">空运周容量</label>
              <input id="air" type="number" min="300" max="2000" step="50" value="900">
            </div>
          </div>
          <div class="field">
            <label for="ocean">海运提前期周数</label>
            <input id="ocean" type="number" min="1" max="6" step="1" value="3">
          </div>
          <div class="data-editor hidden" id="scenarioDataEditor">
            <div class="data-editor-title">需求与库存参数</div>
            <div class="data-editor-grid" id="scenarioDataGrid"></div>
          </div>
          <div class="alert" id="note">切换仓网模式会自动套用一组演示参数，也可以继续手工调整。</div>
        </div>
        <div class="model-explain" id="modelExplain"></div>
        <div class="metrics" id="metrics"></div>
        <div class="bands" id="bands"></div>
      </div>
    </section>
  </main>

  <script>
    const solveBtn = document.getElementById('solveBtn');
    const statusTag = document.getElementById('statusTag');
    const modelExplain = document.getElementById('modelExplain');
    const metrics = document.getElementById('metrics');
    const bands = document.getElementById('bands');
    const note = document.getElementById('note');
    const scenarioSelect = document.getElementById('scenario');
    const scenarioNav = document.getElementById('scenarioNav');
    const currentScenarioName = document.getElementById('currentScenarioName');
    const demandInput = document.getElementById('demand');
    const slaInput = document.getElementById('sla');
    const penaltyInput = document.getElementById('penalty');
    const airInput = document.getElementById('air');
    const oceanInput = document.getElementById('ocean');
    const scenarioDataEditor = document.getElementById('scenarioDataEditor');
    const scenarioDataGrid = document.getElementById('scenarioDataGrid');
    let solveRequestId = 0;

    const presets = {
      strict_sla: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '严格 SLA：用正常需求和严格时效，通常需要区域海外仓。'
      },
      soft_capacity: {
        demand: 1.25,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '旺季缺口分析：需求上涨 25%，不扩容，观察哪些市场会缺履约能力。'
      },
      capacity_expansion: {
        demand: 1.25,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '旺季临时扩容：需求上涨 25%，允许购买临时仓容，比较扩容和丢单哪个更划算。'
      },
      inventory_placement: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '库存前置分配：看哪些 SKU 适合放进海外仓，哪些继续直邮。'
      },
      market_entry: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '新市场进入决策：判断新国家市场先直邮试水，还是启用区域仓或本地 3PL。'
      },
      weather_risk_network: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '天气风险建仓选址：把极端天气导致的中断风险纳入仓库选址和分仓。'
      },
      profit_allocation: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '库存不足利润优先分配：在库存有限时优先满足高贡献市场，并守住服务底线。'
      },
      replenishment_scenarios: {
        demand: 1,
        sla: 0,
        penalty: 18,
        air: 900,
        ocean: 3,
        note: '补货情景分析：比较空运扩容、缺货罚分和海运提前期变化。'
      },
      supplier_sourcing: {
        demand: 1,

    function money(value) {
      return Number(value || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
    }

    function num(value) {
      return Number(value || 0).toLocaleString(undefined, { maximumFractionDigits: 1 });
    }

    function metric(label, value) {
      return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${value}</div></div>`;
    }

    function table(headers, rows) {
      return `<table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

    }

    function chartCard(title, html) {
      return `<div class="chart-card"><div class="chart-title">${title}</div>${html || '<div class="chart-empty">暂无可视化数据</div>'}</div>`;
    }

    function barChart(rows, options = {}) {
      const filtered = rows.filter(row => Number(row.value) > 0);
      if (!filtered.length) return '';
      const max = Math.max(...filtered.map(row => Number(row.value)), 1);
      return filtered.map(row => {
        const width = Math.max(2, Math.round((Number(row.value) / max) * 100));
        const klass = row.color ? ` ${row.color}` : '';
        const value = options.money ? money(row.value) : num(row.value);
        return `
          <div class="bar-row">
            <div class="bar-label">${row.label}</div>
            <div class="bar-track"><div class="bar-fill${klass}" style="width:${width}%"></div></div>
            <div class="bar-value">${value}</div>
          </div>`;
      }).join('');
    }

      const validGroups = groups.filter(group => group.segments.some(segment => Number(segment.value) > 0));
      if (!validGroups.length) return '';
      return validGroups.map(group => {
        const total = group.segments.reduce((sum, segment) => sum + Number(segment.value || 0), 0);
        const segments = group.segments
          .filter(segment => Number(segment.value) > 0)
          .map((segment, index) => {
            const width = Math.max(2, (Number(segment.value) / total) * 100);
            return `<div class="stack-segment" title="${segment.label}: ${num(segment.value)}" style="width:${width}%;background:${colors[index % colors.length]}"></div>`;
          })
          .join('');
        return `
          <div class="stack-row">
            <div class="stack-head"><span>${group.label}</span><span>${num(total)}</span></div>
            <div class="stack-track">${segments}</div>
          </div>`;
      }).join('');
    }

    function extractTextMetrics(text) {
      const patterns = [
        ['Total cost', /Total cost:\s*([0-9.]+)/g],
        ['Objective value', /Objective value:\s*([0-9.]+)/g],
        ['Logistics cost', /Logistics cost:\s*([0-9.]+)/g],
        ['Carbon kg', /Carbon kg:\s*([0-9.]+)/g],
        ['Expected risky orders', /Expected risky orders:\s*([0-9.]+)/g],
        ['Disruption penalty', /Disruption penalty:\s*([0-9.]+)/g],
        ['Reserve cost', /Reserve cost:\s*([0-9.]+)/g]
      ];
      return patterns.flatMap(([label, pattern]) => {
        const rows = [];
        let match;
        while ((match = pattern.exec(text)) !== null) {
          rows.push({ label: rows.length ? `${label} ${rows.length + 1}` : label, value: Number(match[1]) });
        }
        return rows;
      });
    }

    function renderStructuredCharts(network, replenishment, service) {
      const costBars = barChart([
        { label: '仓网成本', value: network.total_cost, color: 'green' },
        { label: '补货成本', value: replenishment.total_cost, color: 'amber' },
        { label: '服务组合成本', value: service.total_cost, color: 'red' },
        { label: '未履约损失', value: network.unfulfilled_cost || 0, color: 'red' },
        { label: '扩容成本', value: network.expansion_cost || 0, color: 'amber' }
      ], { money: true });

      const capacityBars = barChart((network.capacity_plan || []).map(row => ({
        label: row.warehouse,
        value: row.used_capacity,
        color: Number(row.extra_capacity || 0) > 0 ? 'amber' : 'green'
      })));

      const replenishBars = barChart((replenishment.orders || []).map(row => ({
        label: `${row.week} ${row.lane}`,
        value: row.units,
        color: row.lane === 'air' ? 'amber' : 'green'
      })));

      const serviceGroups = Object.entries(service.allocation || {})
        .filter(([, rows]) => Array.isArray(rows))
        .map(([market, rows]) => ({
          label: market,
          segments: rows.map(row => ({ label: row.service, value: row.orders }))
        }));

      return `<div class="charts">${
        [
          chartCard('成本拆分', costBars),
          chartCard('仓库容量使用', capacityBars),
          chartCard('补货订单量', replenishBars),
          chartCard('服务组合占比', stackedChart(serviceGroups))
        ].join('')
      }</div>`;
    }

    function renderModelExplain() {
      const doc = modelDocs[scenarioSelect.value] || modelDocs.strict_sla;
      const block = (title, items) => `
        <div class="explain-card">
          <div class="explain-title">${title}</div>
          <ul>${items.map(item => `<li>${item}</li>`).join('')}</ul>
        </div>`;
      modelExplain.innerHTML = [
        block('决策变量', doc.variables),
        block('目标函数', doc.objective),
        block('主要约束', doc.constraints),
        block('怎么看结果', doc.reading)
      ].join('');
    }

    function updateScenarioNav() {
      currentScenarioName.textContent = scenarioSelect.options[scenarioSelect.selectedIndex].text;
      scenarioNav.querySelectorAll('.nav-item').forEach(button => {
        button.classList.toggle('active', button.dataset.scenario === scenarioSelect.value);
      });
    }

    function renderScenarioDataEditor() {
      const config = scenarioParamDefaults[scenarioSelect.value];
      if (!config) {
        scenarioDataEditor.classList.add('hidden');
        scenarioDataGrid.innerHTML = '';
        return;
      }

      scenarioDataEditor.classList.remove('hidden');
      scenarioDataEditor.querySelector('.data-editor-title').textContent = config.title;
      scenarioDataGrid.innerHTML = [
        '<div class="data-editor-heading">仓库</div>',
        '<div class="data-editor-heading">初始库存</div>',
        '<div class="data-editor-heading">需求</div>',
        ...Object.entries(config.warehouses).flatMap(([warehouse, values]) => [
          `<div class="data-editor-name">${warehouse}</div>`,
          `<input class="scenario-data-input" data-group="warehouses" data-name="${warehouse}" data-field="initial" type="number" min="0" step="100" value="${values.initial}">`,
          `<input class="scenario-data-input" data-group="warehouses" data-name="${warehouse}" data-field="demand" type="number" min="0" step="100" value="${values.demand}">`
        ])
      ].join('');
    }

    function readScenarioParams() {
      const params = {};
      scenarioDataGrid.querySelectorAll('.scenario-data-input').forEach(input => {
        const group = input.dataset.group;
        const name = input.dataset.name;
        const field = input.dataset.field;
        params[group] = params[group] || {};
        params[group][name] = params[group][name] || {};
        params[group][name][field] = Number(input.value);
      });
      return params;
    }

    function pre(text) {
      return `<pre style="margin:0;padding:14px;overflow:auto;white-space:pre;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">${escapeHtml(text || '')}</pre>`;
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    async function solve() {
      const selectedScenarioName = scenarioSelect.options[scenarioSelect.selectedIndex].text;
      const requestId = ++solveRequestId;
      solveBtn.disabled = true;
      statusTag.textContent = 'solving';
      note.className = 'alert';
      note.textContent = `CPLEX 正在求解：${selectedScenarioName}`;

      const payload = {
        scenario: scenarioSelect.value,
        demand_multiplier: Number(demandInput.value),
        sla_extra_days: Number(slaInput.value),
        unfulfilled_penalty: Number(penaltyInput.value),
        air_capacity: Number(airInput.value),
        ocean_lead_time: Number(oceanInput.value),
        scenario_params: readScenarioParams()
      };

      try {
        const response = await fetch('/api/simulate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (requestId !== solveRequestId) return;
        render(data);
        statusTag.textContent = data.status;
        note.textContent = `求解完成：${selectedScenarioName}`;
      } catch (error) {
        if (requestId !== solveRequestId) return;
        statusTag.textContent = 'error';
        note.className = 'alert bad';
        note.textContent = error.message;
      } finally {
        if (requestId === solveRequestId) {
          solveBtn.disabled = false;
        }
      }
    }

    function applyPreset() {
      const preset = presets[scenarioSelect.value];
      updateScenarioNav();
      demandInput.value = preset.demand;
      slaInput.value = preset.sla;
      penaltyInput.value = preset.penalty;
      airInput.value = preset.air;
      oceanInput.value = preset.ocean;
      renderScenarioDataEditor();
      note.className = 'alert';
      note.textContent = preset.note;
      renderModelExplain();
      solve();
    }

    function render(data) {
      renderModelExplain();
      const network = data.network || {};
      const replenishment = data.replenishment || {};
      const service = data.service_mix || {};

      if (data.text_output !== undefined) {
        const textMetrics = extractTextMetrics(data.text_output || '');
        metrics.innerHTML = [
          metric('场景', scenarioSelect.options[scenarioSelect.selectedIndex].text),
          metric('状态', data.status),
          metric('返回码', data.return_code || 0),
          metric('输出行数', (data.text_output || '').split('\n').filter(Boolean).length)
        ].join('');
        bands.innerHTML = [
          textMetrics.length ? band('关键指标图表', `<div class="content"><div class="charts">${chartCard('文本输出指标', barChart(textMetrics, { money: true }))}</div></div>`) : '',
          band('求解输出', pre(data.text_output), data.scenario || ''),
          data.error_output ? band('错误输出', pre(data.error_output), 'stderr') : ''
        ].join('');
        return;
      }

      metrics.innerHTML = [
        metric('仓网总成本', money(network.total_cost)),
        metric('未履约订单', num(network.total_unfulfilled)),
        metric('补货总成本', money(replenishment.total_cost)),
        metric('服务组合成本', money(service.total_cost))
      ].join('');

      const opened = (network.opened_warehouses || []).map(w => `<span class="pill">${w}</span>`).join('') || '无';
      const networkRows = [];
      Object.entries(network.fulfillment_plan || {}).forEach(([market, assignments]) => {
        assignments.forEach(item => {
          networkRows.push([market, item.warehouse, num(item.orders), item.delivery_days || '']);
        });
      });

      const capacityRows = (network.capacity_plan || []).map(row => [
        row.warehouse,
        num(row.used_capacity),
        num(row.base_capacity),
        num(row.extra_capacity || 0)
      ]);

      const replenishRows = (replenishment.orders || []).map(row => [
        row.week,
        row.lane,
        num(row.units)
      ]);

      const inventoryRows = Object.entries(replenishment.inventory_projection || {}).map(([week, row]) => [
        week,
        num(row.demand),
        num(row.ending_inventory),
        num(row.stockout)
      ]);

      const serviceRows = [];
      Object.entries(service.allocation || {}).forEach(([market, rows]) => {
        if (!Array.isArray(rows)) return;
        rows.forEach(row => {
          serviceRows.push([market, row.service, num(row.orders), row.delivery_days, row.unit_cost]);
        });
      });

      bands.innerHTML = [
        band('可视化图表', `<div class="content">${renderStructuredCharts(network, replenishment, service)}</div>`),
        band('启用仓库', `<div class="content">${opened}</div>`, network.status || ''),
        band('仓网履约', table(['市场', '仓库', '订单', '天数'], networkRows)),
        capacityRows.length ? band('容量与扩容', table(['仓库', '使用', '基础容量', '临时扩容'], capacityRows)) : '',
        band('补货订单', table(['周', '方式', '数量'], replenishRows), `缺货 ${num(replenishment.total_stockout)}`),
        band('库存预测', table(['周', '需求', '期末库存', '缺货'], inventoryRows)),
        band('物流服务组合', table(['市场', '服务', '订单', '天数', '单位成本'], serviceRows), service.status || '')
      ].join('');
    }

    solveBtn.addEventListener('click', solve);
    scenarioSelect.addEventListener('change', applyPreset);
    scenarioNav.querySelectorAll('.nav-item').forEach(button => {
      button.addEventListener('click', () => {
        scenarioSelect.value = button.dataset.scenario;
        applyPreset();
      });
    });
    scenarioDataGrid.addEventListener('change', solve);
    applyPreset();
  </script>
</body>
</html>
