<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跨境电商库存与运输模拟器</title>
  <style>
    :root {
      --bg: #f5f7f8;
      --panel: #ffffff;
      --ink: #20252b;
      --muted: #65717d;
      --line: #dce2e8;
      --blue: #1f6feb;
      --green: #147d55;
      --amber: #9a6400;
      --red: #b8392f;
      --soft-blue: #e8f1ff;
      --soft-green: #e7f5ee;
      --soft-amber: #fff3d6;
      --soft-red: #fdecea;
      --soft-gray: #edf1f4;
      --shadow: 0 14px 34px rgba(28, 38, 50, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .header-inner,
    main {
      width: min(1240px, calc(100% - 32px));
      margin: 0 auto;
    }

    .header-inner {
      padding: 22px 0 18px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      padding: 22px 0 42px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      align-items: start;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-head {
      min-height: 58px;
      padding: 15px 17px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .tag {
      border-radius: 8px;
      padding: 5px 9px;
      color: var(--green);
      background: var(--soft-green);
      font-size: 12px;
      font-weight: 760;
      white-space: nowrap;
    }

    .controls,
    .content {
      padding: 16px 17px 18px;
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 720;
    }

    select,
    input {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 9px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-weight: 700;
    }

    .scenario-select-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .scenario-nav {
      display: grid;
      gap: 13px;
    }

    .nav-group {
      display: grid;
      gap: 7px;
    }

    .nav-group-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 820;
    }

    .nav-item {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
      color: var(--ink);
      text-align: left;
      font-size: 13px;
      font-weight: 780;
      line-height: 1.25;
      box-shadow: none;
    }

    .nav-item:hover {
      border-color: #b8c4d1;
      background: #f8fafc;
    }

    .nav-item.active {
      border-color: #b6caff;
      background: var(--soft-blue);
      color: var(--blue);
      box-shadow: inset 4px 0 0 var(--blue);
    }

    .parameter-divider {
      height: 1px;
      background: var(--line);
      margin: 2px 0;
    }

    .current-scenario {
      display: grid;
      gap: 4px;
      padding: 10px 11px;
      border: 1px solid #b6caff;
      border-radius: 8px;
      background: var(--soft-blue);
    }

    .current-scenario-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 780;
    }

    .current-scenario-name {
      color: var(--blue);
      font-size: 15px;
      font-weight: 850;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-weight: 820;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.72;
      cursor: progress;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .model-explain {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .explain-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
      min-width: 0;
    }

    .explain-title {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 820;
    }

    .explain-card ul {
      margin: 0;
      padding-left: 18px;
    }

    .explain-card li {
      margin: 4px 0;
      font-size: 13px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
    }

    .metric-value {
      margin-top: 4px;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 850;
      overflow-wrap: anywhere;
    }

    .bands {
      display: grid;
      gap: 12px;
    }

    .band {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .band-title {
      padding: 10px 12px;
      background: var(--soft-gray);
      font-weight: 820;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      border-top: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      background: #fafbfc;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 8px;
      padding: 3px 8px;
      background: var(--soft-blue);
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      margin: 2px 4px 2px 0;
    }

    .alert {
      background: var(--soft-amber);
      color: var(--amber);
      border: 1px solid #f2d79b;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 720;
    }

    .bad {
      background: var(--soft-red);
      color: var(--red);
      border-color: #f3c6c1;
    }

    @media (max-width: 900px) {
      .header-inner,
      main {
        width: min(100% - 24px, 1240px);
        grid-template-columns: 1fr;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .model-explain {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>跨境电商库存与运输模拟器</h1>
        <p class="subtitle">仓网、库存、补货、服务等级、促销、退货和绿色物流的 CPLEX 求解演示</p>
      </div>
      <button id="solveBtn">重新求解</button>
    </div>
  </header>

  <main>
    <section>
      <div class="section-head">
        <h2>场景导航与参数</h2>
        <span class="tag">CPLEX</span>
      </div>
      <div class="controls">
        <div class="field scenario-select-hidden">
          <label for="scenario">演示场景</label>
          <select id="scenario" aria-label="演示场景">
            <optgroup label="仓网与履约">
              <option value="strict_sla">严格 SLA</option>
              <option value="soft_capacity">旺季缺口分析</option>
              <option value="capacity_expansion">旺季临时扩容</option>
              <option value="inventory_placement">库存前置分配</option>
              <option value="profit_allocation">库存不足利润优先分配</option>
            </optgroup>
            <optgroup label="补货与库存">
              <option value="replenishment_scenarios">补货情景分析</option>
              <option value="safety_stock">安全库存优化</option>
              <option value="robust_inventory">稳健库存计划</option>
            </optgroup>
            <optgroup label="物流路径与服务">
              <option value="landed_cost">Landed Cost 路径选择</option>
              <option value="percentile_sla">百分比 SLA 路径选择</option>
              <option value="green_logistics">绿色物流成本/碳排</option>
              <option value="multi_objective">多目标权衡</option>
              <option value="channel_allocation">渠道分配优化</option>
            </optgroup>
            <optgroup label="经营动作">
              <option value="returns">退货逆向物流</option>
              <option value="promotion_planning">促销预算计划</option>
              <option value="promotion_sensitivity">促销预算敏感性</option>
              <option value="penalty_sensitivity">未履约罚分敏感性</option>
              <option value="dashboard">经营看板汇总</option>
            </optgroup>
          </select>
        </div>
        <nav class="scenario-nav" id="scenarioNav" aria-label="演示场景导航">
          <div class="nav-group">
            <div class="nav-group-title">仓网与履约</div>
            <button type="button" class="nav-item" data-scenario="strict_sla">严格 SLA</button>
            <button type="button" class="nav-item" data-scenario="soft_capacity">旺季缺口分析</button>
            <button type="button" class="nav-item" data-scenario="capacity_expansion">旺季临时扩容</button>
            <button type="button" class="nav-item" data-scenario="inventory_placement">库存前置分配</button>
            <button type="button" class="nav-item" data-scenario="profit_allocation">库存不足利润优先分配</button>
          </div>
          <div class="nav-group">
            <div class="nav-group-title">补货与库存</div>
            <button type="button" class="nav-item" data-scenario="replenishment_scenarios">补货情景分析</button>
            <button type="button" class="nav-item" data-scenario="safety_stock">安全库存优化</button>
            <button type="button" class="nav-item" data-scenario="robust_inventory">稳健库存计划</button>
          </div>
          <div class="nav-group">
            <div class="nav-group-title">物流路径与服务</div>
            <button type="button" class="nav-item" data-scenario="landed_cost">Landed Cost 路径选择</button>
            <button type="button" class="nav-item" data-scenario="percentile_sla">百分比 SLA 路径选择</button>
            <button type="button" class="nav-item" data-scenario="green_logistics">绿色物流成本/碳排</button>
            <button type="button" class="nav-item" data-scenario="multi_objective">多目标权衡</button>
            <button type="button" class="nav-item" data-scenario="channel_allocation">渠道分配优化</button>
          </div>
          <div class="nav-group">
            <div class="nav-group-title">经营动作</div>
            <button type="button" class="nav-item" data-scenario="returns">退货逆向物流</button>
            <button type="button" class="nav-item" data-scenario="promotion_planning">促销预算计划</button>
            <button type="button" class="nav-item" data-scenario="promotion_sensitivity">促销预算敏感性</button>
            <button type="button" class="nav-item" data-scenario="penalty_sensitivity">未履约罚分敏感性</button>
            <button type="button" class="nav-item" data-scenario="dashboard">经营看板汇总</button>
          </div>
        </nav>
        <div class="current-scenario">
          <div class="current-scenario-label">当前场景</div>
          <div class="current-scenario-name" id="currentScenarioName">严格 SLA</div>
        </div>
        <div class="parameter-divider"></div>
        <div class="grid">
          <div class="field">
            <label for="demand">需求倍率</label>
            <input id="demand" type="number" min="0.5" max="2" step="0.05" value="1">
          </div>
          <div class="field">
            <label for="sla">SLA 放宽天数</label>
            <input id="sla" type="number" min="0" max="10" step="1" value="0">
          </div>
        </div>
        <div class="grid">
          <div class="field">
            <label for="penalty">未履约罚分</label>
            <input id="penalty" type="number" min="1" max="120" step="1" value="50">
          </div>
          <div class="field">
            <label for="air">空运周容量</label>
            <input id="air" type="number" min="300" max="2000" step="50" value="900">
          </div>
        </div>
        <div class="field">
          <label for="ocean">海运提前期周数</label>
          <input id="ocean" type="number" min="1" max="6" step="1" value="3">
        </div>
        <div class="alert" id="note">切换仓网模式会自动套用一组演示参数，也可以继续手工调整。</div>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2>求解结果</h2>
        <span class="tag" id="statusTag">ready</span>
      </div>
      <div class="content">
        <div class="model-explain" id="modelExplain"></div>
        <div class="metrics" id="metrics"></div>
        <div class="bands" id="bands"></div>
      </div>
    </section>
  </main>

  <script>
    const solveBtn = document.getElementById('solveBtn');
    const statusTag = document.getElementById('statusTag');
    const modelExplain = document.getElementById('modelExplain');
    const metrics = document.getElementById('metrics');
    const bands = document.getElementById('bands');
    const note = document.getElementById('note');
    const scenarioSelect = document.getElementById('scenario');
    const scenarioNav = document.getElementById('scenarioNav');
    const currentScenarioName = document.getElementById('currentScenarioName');
    const demandInput = document.getElementById('demand');
    const slaInput = document.getElementById('sla');
    const penaltyInput = document.getElementById('penalty');
    const airInput = document.getElementById('air');
    const oceanInput = document.getElementById('ocean');
    let solveRequestId = 0;

    const presets = {
      strict_sla: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '严格 SLA：用正常需求和严格时效，通常需要区域海外仓。'
      },
      soft_capacity: {
        demand: 1.25,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '旺季缺口分析：需求上涨 25%，不扩容，观察哪些市场会缺履约能力。'
      },
      capacity_expansion: {
        demand: 1.25,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '旺季临时扩容：需求上涨 25%，允许购买临时仓容，比较扩容和丢单哪个更划算。'
      },
      inventory_placement: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '库存前置分配：看哪些 SKU 适合放进海外仓，哪些继续直邮。'
      },
      profit_allocation: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '库存不足利润优先分配：在库存有限时优先满足高贡献市场，并守住服务底线。'
      },
      replenishment_scenarios: {
        demand: 1,
        sla: 0,
        penalty: 18,
        air: 900,
        ocean: 3,
        note: '补货情景分析：比较空运扩容、缺货罚分和海运提前期变化。'
      },
      safety_stock: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '安全库存优化：预算有限时，为不同 SKU 选择服务水平。'
      },
      robust_inventory: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '稳健库存计划：同时考虑低/中/高需求场景下的持有和缺货风险。'
      },
      landed_cost: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: 'Landed Cost：把运费、税费和清关路径一起纳入成本。'
      },
      percentile_sla: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '百分比 SLA：不是看平均时效，而是要求一定比例订单 N 天内送达。'
      },
      green_logistics: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '绿色物流：比较成本和碳排放之间的取舍。'
      },
      multi_objective: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '多目标权衡：把成本、速度、碳排和履约风险放进同一个评分函数里比较。'
      },
      channel_allocation: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '渠道分配：在 FBA、品牌 3PL、直邮之间分配订单。'
      },
      returns: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '退货逆向物流：决定退货件翻新、转仓还是报废。'
      },
      promotion_planning: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '促销预算计划：决定哪些 SKU 值得投促销预算。'
      },
      promotion_sensitivity: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '促销预算敏感性：预算增加时，促销组合和净贡献如何变化。'
      },
      penalty_sensitivity: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '未履约罚分敏感性：观察罚分达到多少时模型开始选择扩容。'
      },
      dashboard: {
        demand: 1,
        sla: 0,
        penalty: 50,
        air: 900,
        ocean: 3,
        note: '经营看板汇总：把仓网、缺口、扩容、补货和服务组合放在一张管理表里。'
      }
    };

    const modelDocs = {
      strict_sla: {
        variables: ['open_warehouse[w]：是否启用仓库', 'ship[w,m]：仓库 w 给市场 m 发多少订单'],
        objective: ['最小化：仓库固定成本 + 履约变动成本'],
        constraints: ['每个市场需求必须满足', '仓库发货量不能超过容量', '超过 SLA 天数的线路禁止使用'],
        reading: ['看启用了哪些仓', '看每个市场由哪个仓履约', '看总成本是否可接受']
      },
      soft_capacity: {
        variables: ['open_warehouse[w]', 'ship[w,m]', 'unfulfilled[m]：市场 m 未履约订单'],
        objective: ['最小化：固定成本 + 变动成本 + 未履约罚分'],
        constraints: ['发货量 + 未履约量 = 市场需求', '仓库容量不能超', 'SLA 不合格线路禁止使用'],
        reading: ['看缺口落在哪个市场', '看哪些仓库接近满载', '用于解释旺季为什么无解']
      },
      capacity_expansion: {
        variables: ['open_warehouse[w]', 'ship[w,m]', 'extra_capacity[w]：临时扩容', 'unfulfilled[m]'],
        objective: ['最小化：固定成本 + 履约成本 + 扩容成本 + 未履约罚分'],
        constraints: ['发货量不能超过基础容量 + 临时扩容', '扩容只能发生在启用仓', '需求可用未履约量兜底'],
        reading: ['看该不该扩容', '看扩容在哪个仓、扩多少', '比较扩容成本和丢单损失']
      },
      inventory_placement: {
        variables: ['place[sku,market]：某 SKU 前置到海外仓数量', 'direct_ship[sku,market]：继续直邮数量'],
        objective: ['最大化：销售贡献 - 本地配送成本 - 仓储成本 - 直邮成本'],
        constraints: ['前置数量 + 直邮数量 = 市场需求', '每个海外仓体积容量不能超'],
        reading: ['看哪些 SKU 值得前置', '体积大、贡献低的 SKU 通常更容易直邮']
      },
      profit_allocation: {
        variables: ['fulfill[sku,market]：库存分给某 SKU/市场的数量'],
        objective: ['最大化：单位贡献 × 履约数量'],
        constraints: ['每个 SKU 可用库存不能超', '不能超过各市场需求', '每个市场有最低服务率'],
        reading: ['看库存不足时优先满足谁', '看服务率底线是否刚好卡住']
      },
      replenishment_scenarios: {
        variables: ['order[lane,week]：每周空运/海运下单量', 'ending_inventory[week]', 'stockout[week]'],
        objective: ['最小化：运输成本 + 库存持有成本 + 缺货罚分'],
        constraints: ['期末库存 = 期初库存 + 到货 - 需求 + 缺货', '空运/海运每周容量限制', '期末库存目标'],
        reading: ['看空运和海运怎么搭配', '看缺货是否由提前期造成']
      },
      safety_stock: {
        variables: ['choose[sku,level]：SKU 选择 basic/standard/premium 安全库存'],
        objective: ['最大化：预算内的缺货保护价值'],
        constraints: ['每个 SKU 只能选一个服务水平', '安全库存总成本不能超过预算'],
        reading: ['看哪些 SKU 被优先保护', '预算越紧，越需要分层保护']
      },
      robust_inventory: {
        variables: ['buy[sku]：采购数量', 'leftover[sku,scenario]', 'stockout[sku,scenario]'],
        objective: ['最小化：采购成本 + 期望持有成本 + 期望缺货损失'],
        constraints: ['每个需求场景下库存平衡', '总仓容限制', '采购预算限制'],
        reading: ['看低/中/高需求下的剩余和缺货', '这是抗预测误差的备货方案']
      },
      landed_cost: {
        variables: ['use_route[r]：是否启用路径', 'orders[r,m]：路径 r 承担市场 m 订单量'],
        objective: ['最小化：路径固定成本 + 运费 + 关税/清关成本'],
        constraints: ['市场需求必须满足', '路径容量限制', '平均时效 SLA'],
        reading: ['看 DDU/DDP/保税仓如何组合', '不要只看运费，要看到岸综合成本']
      },
      percentile_sla: {
        variables: ['use_route[r]', 'orders[r,m]'],
        objective: ['最小化：路径固定成本 + 单票履约成本'],
        constraints: ['市场需求必须满足', '路径容量限制', '至少 X% 订单在 N 天内送达'],
        reading: ['看哪些慢线路被限制', '百分比 SLA 比平均 SLA 更像真实承诺']
      },
      green_logistics: {
        variables: ['orders[route,market]：各路线承接订单量'],
        objective: ['最小化：物流成本 + 碳价 × 碳排放'],
        constraints: ['市场需求满足', '路线容量限制', '平均时效 SLA'],
        reading: ['看碳价升高后是否更多使用低碳路线', '低碳不能突破时效约束']
      },
      multi_objective: {
        variables: ['orders[route,market]：每条物流路径服务每个市场的订单量'],
        objective: ['最小化：物流成本 + 速度权重 × 总送达天数 + 碳权重 × 碳排 + 风险权重 × 预计风险订单'],
        constraints: ['每个市场需求必须满足', '每条路径不能超过容量', '每个市场平均送达天数不能超过 SLA'],
        reading: ['看权重变化如何改变路线组合', '这是把多个经营目标转成同一把尺子的做法']
      },
      channel_allocation: {
        variables: ['orders[channel,market]：渠道承接订单量'],
        objective: ['最大化：销售额 - 商品成本 - 履约成本 - 平台佣金'],
        constraints: ['市场需求满足', '渠道容量限制', '每个市场最低快速履约比例'],
        reading: ['看 FBA、3PL、直邮如何分工', '直邮利润高但会受时效比例限制']
      },
      returns: {
        variables: ['refurb_local[sku,region]', 'transfer_refurb[sku,source,target]', 'scrap[sku,region]'],
        objective: ['最大化：二次销售价值 + 回收价值 - 翻新/转运成本'],
        constraints: ['每个退货 SKU 必须被处理', '区域翻新产能限制'],
        reading: ['看高价值 SKU 是否优先翻新', '低价值 SKU 可能被报废回收']
      },
      promotion_planning: {
        variables: ['promote[sku]：是否促销', 'fulfilled[sku]：实际履约销量'],
        objective: ['最大化：毛利贡献 - 促销花费'],
        constraints: ['履约不能超过促销后需求', '履约不能超过库存', '促销预算和 SKU 数限制'],
        reading: ['看哪些 SKU 值得投放', '促销需求也会被库存卡住']
      },
      promotion_sensitivity: {
        variables: ['不同预算下重复求解 promote[sku] 和 fulfilled[sku]'],
        objective: ['比较预算变化带来的净贡献变化'],
        constraints: ['每次求解都有预算、库存和最多促销 SKU 限制'],
        reading: ['看预算边际收益何时停止', '找最佳促销预算区间']
      },
      penalty_sensitivity: {
        variables: ['不同罚分下重复求解扩容和未履约变量'],
        objective: ['比较未履约罚分变化对扩容决策的影响'],
        constraints: ['每次求解都有仓容、SLA 和需求约束'],
        reading: ['看罚分达到多少时开始扩容', '帮助校准丢单成本估值']
      },
      dashboard: {
        variables: ['调用多个模型的关键结果，不新增单一优化变量'],
        objective: ['把成本、缺口、扩容、补货和服务组合放进管理摘要'],
        constraints: ['继承各子模型自己的约束'],
        reading: ['适合汇报总览', '用来比较多个经营动作的成本与风险']
      }
    };

    function money(value) {
      return Number(value || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
    }

    function num(value) {
      return Number(value || 0).toLocaleString(undefined, { maximumFractionDigits: 1 });
    }

    function metric(label, value) {
      return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${value}</div></div>`;
    }

    function table(headers, rows) {
      return `<table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    }

    function band(title, html, tag = '') {
      return `<div class="band"><div class="band-title"><span>${title}</span><span>${tag}</span></div>${html}</div>`;
    }

    function renderModelExplain() {
      const doc = modelDocs[scenarioSelect.value] || modelDocs.strict_sla;
      const block = (title, items) => `
        <div class="explain-card">
          <div class="explain-title">${title}</div>
          <ul>${items.map(item => `<li>${item}</li>`).join('')}</ul>
        </div>`;
      modelExplain.innerHTML = [
        block('决策变量', doc.variables),
        block('目标函数', doc.objective),
        block('主要约束', doc.constraints),
        block('怎么看结果', doc.reading)
      ].join('');
    }

    function updateScenarioNav() {
      currentScenarioName.textContent = scenarioSelect.options[scenarioSelect.selectedIndex].text;
      scenarioNav.querySelectorAll('.nav-item').forEach(button => {
        button.classList.toggle('active', button.dataset.scenario === scenarioSelect.value);
      });
    }

    function pre(text) {
      return `<pre style="margin:0;padding:14px;overflow:auto;white-space:pre;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">${escapeHtml(text || '')}</pre>`;
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    async function solve() {
      const selectedScenarioName = scenarioSelect.options[scenarioSelect.selectedIndex].text;
      const requestId = ++solveRequestId;
      solveBtn.disabled = true;
      statusTag.textContent = 'solving';
      note.className = 'alert';
      note.textContent = `CPLEX 正在求解：${selectedScenarioName}`;

      const payload = {
        scenario: scenarioSelect.value,
        demand_multiplier: Number(demandInput.value),
        sla_extra_days: Number(slaInput.value),
        unfulfilled_penalty: Number(penaltyInput.value),
        air_capacity: Number(airInput.value),
        ocean_lead_time: Number(oceanInput.value)
      };

      try {
        const response = await fetch('/api/simulate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (requestId !== solveRequestId) return;
        render(data);
        statusTag.textContent = data.status;
        note.textContent = `求解完成：${selectedScenarioName}`;
      } catch (error) {
        if (requestId !== solveRequestId) return;
        statusTag.textContent = 'error';
        note.className = 'alert bad';
        note.textContent = error.message;
      } finally {
        if (requestId === solveRequestId) {
          solveBtn.disabled = false;
        }
      }
    }

    function applyPreset() {
      const preset = presets[scenarioSelect.value];
      updateScenarioNav();
      demandInput.value = preset.demand;
      slaInput.value = preset.sla;
      penaltyInput.value = preset.penalty;
      airInput.value = preset.air;
      oceanInput.value = preset.ocean;
      note.className = 'alert';
      note.textContent = preset.note;
      renderModelExplain();
      solve();
    }

    function render(data) {
      renderModelExplain();
      const network = data.network || {};
      const replenishment = data.replenishment || {};
      const service = data.service_mix || {};

      if (data.text_output !== undefined) {
        metrics.innerHTML = [
          metric('场景', scenarioSelect.options[scenarioSelect.selectedIndex].text),
          metric('状态', data.status),
          metric('返回码', data.return_code || 0),
          metric('输出行数', (data.text_output || '').split('\n').filter(Boolean).length)
        ].join('');
        bands.innerHTML = [
          band('求解输出', pre(data.text_output), data.scenario || ''),
          data.error_output ? band('错误输出', pre(data.error_output), 'stderr') : ''
        ].join('');
        return;
      }

      metrics.innerHTML = [
        metric('仓网总成本', money(network.total_cost)),
        metric('未履约订单', num(network.total_unfulfilled)),
        metric('补货总成本', money(replenishment.total_cost)),
        metric('服务组合成本', money(service.total_cost))
      ].join('');

      const opened = (network.opened_warehouses || []).map(w => `<span class="pill">${w}</span>`).join('') || '无';
      const networkRows = [];
      Object.entries(network.fulfillment_plan || {}).forEach(([market, assignments]) => {
        assignments.forEach(item => {
          networkRows.push([market, item.warehouse, num(item.orders), item.delivery_days || '']);
        });
      });

      const capacityRows = (network.capacity_plan || []).map(row => [
        row.warehouse,
        num(row.used_capacity),
        num(row.base_capacity),
        num(row.extra_capacity || 0)
      ]);

      const replenishRows = (replenishment.orders || []).map(row => [
        row.week,
        row.lane,
        num(row.units)
      ]);

      const inventoryRows = Object.entries(replenishment.inventory_projection || {}).map(([week, row]) => [
        week,
        num(row.demand),
        num(row.ending_inventory),
        num(row.stockout)
      ]);

      const serviceRows = [];
      Object.entries(service.allocation || {}).forEach(([market, rows]) => {
        if (!Array.isArray(rows)) return;
        rows.forEach(row => {
          serviceRows.push([market, row.service, num(row.orders), row.delivery_days, row.unit_cost]);
        });
      });

      bands.innerHTML = [
        band('启用仓库', `<div class="content">${opened}</div>`, network.status || ''),
        band('仓网履约', table(['市场', '仓库', '订单', '天数'], networkRows)),
        capacityRows.length ? band('容量与扩容', table(['仓库', '使用', '基础容量', '临时扩容'], capacityRows)) : '',
        band('补货订单', table(['周', '方式', '数量'], replenishRows), `缺货 ${num(replenishment.total_stockout)}`),
        band('库存预测', table(['周', '需求', '期末库存', '缺货'], inventoryRows)),
        band('物流服务组合', table(['市场', '服务', '订单', '天数', '单位成本'], serviceRows), service.status || '')
      ].join('');
    }

    solveBtn.addEventListener('click', solve);
    scenarioSelect.addEventListener('change', applyPreset);
    scenarioNav.querySelectorAll('.nav-item').forEach(button => {
      button.addEventListener('click', () => {
        scenarioSelect.value = button.dataset.scenario;
        applyPreset();
      });
    });
    applyPreset();
  </script>
</body>
</html>
